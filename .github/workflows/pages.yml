# Publie le site (dossier public/) sur GitHub Pages a chaque push sur main.
#
# Le serveur de jeu, lui, ne peut pas tourner ici : GitHub Pages ne sert que
# des fichiers statiques. Il est heberge a part (voir DEPLOIEMENT.md) et son
# adresse est injectee ci-dessous depuis la variable de depot CATAN_SERVER
# (Settings > Secrets and variables > Actions > Variables).
name: Deployer le site sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# une seule publication a la fois, sans annuler celle deja en cours
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # On passe par une variable d environnement et JSON.stringify plutot que
      # d interpoler directement dans le shell : aucune valeur ne peut casser
      # le fichier ni s executer au montage.
      - name: Injecter l adresse du serveur de jeu
        if: vars.CATAN_SERVER != ''
        env:
          CATAN_SERVER: ${{ vars.CATAN_SERVER }}
        run: |
          node -e "require('fs').writeFileSync('public/js/config.js', 'window.CATAN_CONFIG = { server: ' + JSON.stringify(process.env.CATAN_SERVER) + ' };\n')"
          echo "config.js genere :"
          cat public/js/config.js

      - name: Avertir si l adresse du serveur n est pas definie
        if: vars.CATAN_SERVER == ''
        run: |
          echo "::warning::La variable de depot CATAN_SERVER n est pas definie. Le site sera publie mais cherchera le serveur de jeu sur sa propre adresse (github.io), ou il n y en a pas : le multijoueur ne fonctionnera pas. Voir DEPLOIEMENT.md."

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v5
